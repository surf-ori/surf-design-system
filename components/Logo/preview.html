<!-- @dsCard group="Brand" height=200 page subtitle="Official SURF_fc (curl) + SURF_diap (diapositive) marks" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Logo — preview</title>
<style>
  body { margin:0; padding:24px; font-family:var(--font-body); color:var(--fg-1); }
  .eyebrow-l { font:600 11px/1 var(--font-body); letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-3); margin:0 0 10px 0; }
  .grid { display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:14px; align-items:stretch; }
  .tile { border-radius:14px; padding:22px; display:flex; align-items:center; justify-content:center; }
  .light { background:#fff; border:1px solid #ECECEC; }
  .dark { background:#000; }
  .orange { background:#E67300; }
  .diap { height:60px; display:block; }
  .note { margin-top:10px; font:400 12px/1.4 var(--font-body); color:#6B6B6B; }
</style></head>
<body>
  <div class="eyebrow-l">Logo · official mark</div>
  <div class="grid">
    <div class="tile light"><img src="../../assets/logo/SURF_fc.svg" alt="SURF" style="height:84px; display:block"></div>
    <div class="tile dark"><img class="diap" src="../../assets/logo/SURF_diap.svg" alt="SURF"></div>
    <div class="tile orange"><img class="diap" src="../../assets/logo/SURF_diap.svg" alt="SURF"></div>
  </div>
  <div class="note">
    <b>SURF_fc</b> — full mark with the signature curl (use on light backgrounds).
    <b>SURF_diap</b> — diapositive, white mark with the curl, for dark/photographic backgrounds.
  </div>
<script></script>
</body>
</html>
