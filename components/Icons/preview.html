<!-- @dsCard group="Brand" height=180 page subtitle="⚠ Lucide stand-in for SURF icons" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Iconography — preview</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin:0; padding:24px; font-family:var(--font-body); color:var(--fg-1); }
  .eyebrow-l { font:600 11px/1 var(--font-body); letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-3); margin:0 0 10px 0; }
</style></head>
<body>
  <div class="eyebrow-l">Icons — Lucide (stand-in for SURF set)</div>
  <div style="display:grid; grid-template-columns:repeat(10,1fr); gap:14px; align-items:center; color:#E67300">
    <i data-lucide="graduation-cap"></i>
    <i data-lucide="book-open"></i>
    <i data-lucide="cpu"></i>
    <i data-lucide="server"></i>
    <i data-lucide="cloud"></i>
    <i data-lucide="shield-check"></i>
    <i data-lucide="users"></i>
    <i data-lucide="key-round"></i>
    <i data-lucide="globe"></i>
    <i data-lucide="microscope"></i>
  </div>
  <div style="display:grid; grid-template-columns:repeat(10,1fr); gap:14px; align-items:center; color:#000; margin-top:14px">
    <i data-lucide="arrow-right"></i>
    <i data-lucide="download"></i>
    <i data-lucide="search"></i>
    <i data-lucide="settings"></i>
    <i data-lucide="mail"></i>
    <i data-lucide="play"></i>
    <i data-lucide="file-text"></i>
    <i data-lucide="link"></i>
    <i data-lucide="check"></i>
    <i data-lucide="x"></i>
  </div>
  <div style="margin-top:12px; font:400 12px/1.4 var(--font-body); color:#6B6B6B">
    2px stroke, rounded line endings — matches SURF's flat orange/black line style. Substitute with official SURF set when available.
  </div>
<script>lucide.createIcons({attrs:{'stroke-width':2, width:24, height:24}});</script>
</body>
</html>
